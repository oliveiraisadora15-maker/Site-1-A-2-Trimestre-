<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Site</title>
        <style>
            header {
                background-color: rgb(143, 143, 229);
                color: rgb(12, 39, 62);
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid rgba(101, 101, 214, 0.687);
                padding: 16px;
            }

            main {
                background-color: rgb(205, 205, 229);
                color: rgb(12, 39, 62);
                text-align: center;
                max-width: 750px;
                margin: 0 auto;
                border: 5px solid rgb(96, 96, 203);
                padding: 16px;
                display: flex;
                align-items: center;
                gap: 20px;
            }

            img {
               width: 80px;
               height: 80px;
            }
            .artigo-autor{
             font-weight: bold;

            }
        </style>
    </head>
    <body>
        
        <header>
            <h1>Criação de site sobre vida marinha</h1>
            <p>Se aprofundem nesse mar imenso de vida desconhecida</p>
        </header>

        <main>
            <img src="Gemini_Generated_Image_daupzxdaupzxdaup.png" alt="Ilustração de um ecossistema marinho vibrante com tubarão-baleia, tartaruga, polvo e corais detalhados.">
            <div>
                <h2>Meu primeiro post</h2>
                <p>Venha mergulhar nesses mares de conhecimento sobre animais subaquáticos</p>
                <p class="artigo-autor">Por: Isadora Ienke</p>
                <button>🐳<span>0</span></button>
                <button>🦈<span>0</span></button>
                
            </div>
        </main>

    </body>
    <script>
    const botoes = document.querySelectorAll ("main button");
    botoes.forEach(function(botao) {
    botao.addEventListener("click",botaoClicado);

    function botaoClicado (){
    console.log ("fui clicado");
    let texto = botao.querySelector ("span");
    texto.textContent++; 
    }
    });
    </script>
</html>
